[project]
name = "labrecall-ai"
version = "0.1.0"
description = "A memory-first incident repair agent for research pipelines"
requires-python = ">=3.11,<3.14"
dependencies = [
  "boto3>=1.40,<2",
  "fastapi>=0.116,<1",
  "mangum>=0.19,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.10,<3",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "detect-secrets>=1.5,<2",
  "httpx>=0.28,<1",
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/labrecall"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
