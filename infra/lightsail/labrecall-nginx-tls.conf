server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name 32.184.180.92;

    ssl_certificate /etc/letsencrypt/live/32.184.180.92/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/32.184.180.92/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:LabRecallTLS:1m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    client_max_body_size 32k;
    server_tokens off;

    location /api/ {
        limit_req zone=labrecall_api burst=10 nodelay;
        add_header Cache-Control "no-store" always;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
