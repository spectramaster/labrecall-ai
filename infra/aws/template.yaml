AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: LabRecall AI public API on AWS Lambda

Parameters:
  DatabaseSecretArn:
    Type: String
    Description: ARN of a Secrets Manager JSON secret containing DATABASE_URL
  Architecture:
    Type: String
    Default: arm64
    AllowedValues: [arm64, x86_64]
    Description: Lambda instruction-set architecture used for a reproducible comparison
  MemoryNamespace:
    Type: String
    Default: public-demo
    AllowedPattern: "^[a-z0-9-]{3,40}$"
    Description: Isolated CockroachDB namespace for this deployment

Globals:
  Function:
    Timeout: 30
    MemorySize: 1024
    Runtime: python3.12
    Architectures:
      - !Ref Architecture
    ReservedConcurrentExecutions: 2
    LoggingConfig:
      LogFormat: JSON
      ApplicationLogLevel: INFO
      SystemLogLevel: WARN
    Environment:
      Variables:
        LABRECALL_MODE: cloud
        DATABASE_SECRET_ARN: !Ref DatabaseSecretArn
        MEMORY_NAMESPACE: !Ref MemoryNamespace
        RETRIEVAL_MIN_SIMILARITY: "0.65"
        BEDROCK_EMBED_MODEL: amazon.titan-embed-text-v2:0
        BEDROCK_TEXT_MODEL: amazon.nova-lite-v1:0

Resources:
  LabRecallHttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: $default
      DefaultRouteSettings:
        ThrottlingBurstLimit: 10
        ThrottlingRateLimit: 5

  LabRecallApi:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: ../../
      Handler: labrecall.app.handler
      Policies:
        - Statement:
            - Effect: Allow
              Action: bedrock:InvokeModel
              Resource:
                - !Sub arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/amazon.titan-embed-text-v2:0
                - !Sub arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/amazon.nova-lite-v1:0
            - Effect: Allow
              Action: secretsmanager:GetSecretValue # pragma: allowlist secret
              Resource: !Ref DatabaseSecretArn
      Events:
        Root:
          Type: HttpApi
          Properties:
            ApiId: !Ref LabRecallHttpApi
            Path: /
            Method: ANY
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref LabRecallHttpApi
            Path: /{proxy+}
            Method: ANY

  LabRecallLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub /aws/lambda/${LabRecallApi}
      RetentionInDays: 7

Outputs:
  ApiUrl:
    Value: !Sub https://${LabRecallHttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}
  Architecture:
    Value: !Ref Architecture
  MemoryNamespace:
    Value: !Ref MemoryNamespace
  FunctionName:
    Value: !Ref LabRecallApi
